<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2e7d32">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="style.css">
<title>Monitoring Konsumsi</title>
</head>
<body>
<div class="frozen">
<header>
  <div>
    <h1>Seksi Konsumsi</h1>
    <small id="sync"></small>
  </div>
  <div class="hbtn">
    <button id="btnAdmin" title="Admin" hidden>🛠</button>
    <button id="btnSync" title="Sinkron">⟳</button>
    <button id="btnCfg" title="Pengaturan">⚙</button>
  </div>
</header>

<div class="hero">
  <img src="banner.jpg" alt="Family Gathering 2026 - Energi Hijau Dari Bumi Panua" width="1200" height="400">
  <div class="chips">
    <span class="chip">📅 14 Nov 2026</span>
    <span class="chip">📍 Lap. Prokalamasi, Popayato</span>
    <span class="chip hday" id="hday"></span>
  </div>
</div>
</div>

<main>
  <section id="summary"></section>
  <div class="bar">
    <select id="filterStatus"></select>
    <input id="search" type="search" placeholder="Cari vendor / PIC">
  </div>
  <ul id="list"></ul>
</main>

<button id="fab" aria-label="Tambah">+</button>
<nav id="tabs"></nav>

<dialog id="dlgItem">
  <form method="dialog" id="formItem">
    <h2 id="itemTitle">Tambah</h2>
    <label>Vendor <input name="vendor" required></label>
    <div class="row">
      <label>Qty pesan <input name="qty" type="number" min="0" step="1" required></label>
      <label>Status <select name="status"></select></label>
    </div>
    <div class="row nk-hide">
      <label>Desa <input name="desa"></label>
      <label>Handphone <input name="kontak" type="tel"></label>
    </div>
    <div class="row nk-hide">
      <label>Biaya (Rp) <input name="biaya" type="number" min="0" step="1000"></label>
      <label class="lok-txt">Lokasi <input name="lokasiTxt"></label>
    </div>
    <div id="nkOnly">
      <label>Lokasi pengantaran <select name="lokasi"></select></label>
      <fieldset id="cek"><legend>Verifikasi saat tiba</legend></fieldset>
    </div>
    <p id="picNote"></p>
    <div class="actions">
      <button type="button" id="btnDelete" class="danger">Hapus</button>
      <span class="grow"></span>
      <button type="button" id="btnCancel">Batal</button>
      <button type="submit" class="primary">Simpan</button>
    </div>
  </form>
</dialog>

<dialog id="dlgAdmin">
  <h2>Pengaturan Admin</h2>
  <div class="seg">
    <button type="button" data-p="user" class="on">User</button>
    <button type="button" data-p="lokasi">Lokasi</button>
  </div>

  <div id="pUser">
    <ul id="userList"></ul>
    <form id="formUser" autocomplete="off">
      <label>User <input name="user" required autocapitalize="none"></label>
      <label>Nama <input name="nama" required></label>
      <label>Password <input name="pass" required></label>
      <label>Role
        <select name="role">
          <option>User</option>
          <option>Admin</option>
        </select>
      </label>
      <div class="actions">
        <button type="button" id="btnUserDel" class="danger">Hapus</button>
        <span class="grow"></span>
        <button type="button" id="btnUserNew">Baru</button>
        <button type="submit" class="primary">Simpan</button>
      </div>
    </form>
  </div>

  <div id="pLokasi" hidden>
    <form id="formLokasi">
      <label>Lokasi penempatan nasi kotak (satu per baris) <textarea name="list" rows="10"></textarea></label>
      <div class="actions">
        <span class="grow"></span>
        <button type="submit" class="primary">Simpan</button>
      </div>
    </form>
  </div>

  <p id="adminMsg"></p>
  <div class="actions"><span class="grow"></span><button type="button" id="btnAdminClose">Tutup</button></div>
</dialog>

<dialog id="dlgCfg">
  <form method="dialog" id="formCfg">
    <h2 id="cfgTitle">Masuk</h2>
    <label>User <input name="user" autocomplete="username" autocapitalize="none"></label>
    <label>Password <input name="pass" type="password" autocomplete="current-password"></label>
    <p id="cfgMsg"></p>
    <div class="actions">
      <button type="button" id="btnLogout" class="danger">Keluar</button>
      <span class="grow"></span>
      <button type="button" id="btnCfgCancel">Batal</button>
      <button type="submit" class="primary">Masuk</button>
    </div>
  </form>
</dialog>

<dialog id="dlgTarget">
  <form method="dialog" id="formTarget">
    <h2 id="targetTitle">Target</h2>
    <label>Target jumlah (porsi) <input name="target" type="number" min="0" required></label>
    <label>Anggaran (Rp) <input name="anggaran" type="number" min="0" step="1000" required></label>
    <div class="actions">
      <span class="grow"></span>
      <button type="button" id="btnTargetCancel">Batal</button>
      <button type="submit" class="primary">Simpan</button>
    </div>
  </form>
</dialog>

<script src="app.js"></script>
</body>
</html>
