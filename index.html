<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#b45309">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="style.css">
<title>Monitoring Konsumsi</title>
</head>
<body>
<header>
  <h1>Konsumsi Family Gathering</h1>
  <div class="hbtn">
    <button id="btnExport" title="Ekspor">⬇</button>
    <button id="btnImport" title="Impor">⬆</button>
    <input type="file" id="fileImport" accept="application/json" hidden>
  </div>
</header>

<main>
  <section id="summary"></section>
  <div class="bar">
    <select id="filterStatus"></select>
    <input id="search" type="search" placeholder="Cari vendor / menu / PIC">
  </div>
  <ul id="list"></ul>
</main>

<button id="fab" aria-label="Tambah">+</button>
<nav id="tabs"></nav>

<dialog id="dlgItem">
  <form method="dialog" id="formItem">
    <h2 id="itemTitle">Tambah</h2>
    <label>Vendor / UMKM <input name="vendor" required></label>
    <label>Menu <input name="menu" required></label>
    <div class="row">
      <label>Jumlah <input name="qty" type="number" min="0" step="1" required></label>
      <label>Harga satuan <input name="harga" type="number" min="0" step="500" required></label>
    </div>
    <div class="row">
      <label>Dibayar <input name="dibayar" type="number" min="0" step="1000" value="0"></label>
      <label>Status <select name="status"></select></label>
    </div>
    <div class="row">
      <label>PIC <input name="pic"></label>
      <label>Kontak <input name="kontak" type="tel"></label>
    </div>
    <div id="nkOnly">
      <div class="row">
        <label>Desa <input name="desa"></label>
        <label>Lokasi pengantaran <select name="lokasi"></select></label>
      </div>
      <fieldset id="cek"><legend>Verifikasi saat tiba</legend></fieldset>
    </div>
    <label>Catatan <textarea name="catatan" rows="2"></textarea></label>
    <div class="actions">
      <button type="button" id="btnDelete" class="danger">Hapus</button>
      <span class="grow"></span>
      <button type="button" id="btnCancel">Batal</button>
      <button type="submit" class="primary">Simpan</button>
    </div>
  </form>
</dialog>

<dialog id="dlgTarget">
  <form method="dialog" id="formTarget">
    <h2 id="targetTitle">Target</h2>
    <label>Target jumlah (porsi) <input name="target" type="number" min="0" required></label>
    <label>Anggaran (Rp) <input name="anggaran" type="number" min="0" step="1000" required></label>
    <div class="actions">
      <span class="grow"></span>
      <button type="button" id="btnTargetCancel">Batal</button>
      <button type="submit" class="primary">Simpan</button>
    </div>
  </form>
</dialog>

<script src="app.js"></script>
</body>
</html>
